# Copy to config.yaml if you want to change analysis settings.
# Premiere / Cubase / video / audio paths are chosen in the GUI or via CLI flags.

ai:
  enabled: false  # GUI presets enable AI; CLI can use --preset or --ai
  backend: gemini  # local = Qwen on this machine, no API key or cloud fallback
  model: gemini-3.8-flash
  local_model: qwen3-vl:2b-instruct  # Official Ollama Q4_K_M model; setup_local_ai.py installs it
  local_url: http://127.0.0.1:11435
  local_batch_frames: 12  # 6–12; full source is processed in resumable batches
  local_device: cpu  # Default avoids GPU offload; GPU is an explicit opt-in
  local_threads: 2
  local_gpu_layers: 8  # Used only in gpu mode; this is not a GPU utilization cap
  local_analysis_mode: until_filled  # Discover candidate scenes; stop when all slots validate
  local_target_seconds: 300  # Target, not a guarantee of complete output; shortages stay reviewable
  local_max_seconds: 0  # 0 = continue until filled/source exhausted; optional explicit hard time limit
  api_key: ""  # Prefer GEMINI_API_KEY or local GUI settings; never commit keys
  cache_dir: ""  # Defaults to shared output/.ai-cache, independent of job output
  video_fps: 1  # Experiment with 3 or 6 for short animated videos
  max_source_seconds: 0  # 180 analyzes only the first 3 minutes of each source
  shot_fallback: true  # If short of unique shots, permit different segments in one shot
  shortage_policy: complete  # Export a full draft after shortages; strict retains the validation failure
  transition_tail_fallback_sec: 0  # Opt in: allow scene changes in the last 1-2 seconds, with a stable prefix
  final_scene_transition_fallback: false  # Opt in: the final timeline block may contain any scene changes

job:
  name: job
  output_dir: ./output

premiere:
  project: ""
  source_sequence: ""          # unused; source is the selected video file
  template_sequence: "PJ 5 - demo"
  source_media: ""           # one path or a list: ["video1.mp4", "video2.mp4"]
  slot_mode: nested_sequences
  video_track_index: 1
  import_mixdown: true

audio:
  source_match_search_budget_sec: 300  # shared fast-search budget; export is separate
  directory: 'D:\Editor\Voice'
  glob: "*.wav"
  files: []
  max_files: 0

video:
  search_fps: 1               # candidate search; 0 restores the legacy dense search
  reference_discovery: auto   # body crops use fast image screening; objects uses detector screening
  analysis_mode: until_filled  # stop after all cuts pass verification; full ranks every source
  verification_mode: verified  # review exports early for manual face/lip/onset checks
  analysis_chunk_sec: 30
  incremental_fps: 2          # automatic cast scan; selected cuts still verified at 20 fps
  source_kind: live_action
  source_gap_sec: 5.0
  sample_fps: 6
  max_seconds: 0
  min_segment_sec: 0.20
  merge_gap_sec: 0.80
  backend: auto
  speech_model: small
  speech_device: cpu  # CPU by default; auto prefers CUDA; cuda requires GPU
  speech_compute_type: auto  # CUDA: int8_float16; CPU: int8
  speech_device_index: 0
  speech_language: en  # null enables language detection
  require_lip_motion: false  # clear character shots; true requires verified moving mouths
  require_clear_face: true  # no body-only fallback to fill slots; false explicitly allows body shots
  max_similar_cuts: 2  # recurring visual compositions, even far apart in the source; 0 disables
  object_detection:
    enabled: auto  # use the installed whole-character model; false keeps face/pose only
    device: cpu
    device_index: 0
    batch_size: 2
    compute_type: auto  # CUDA uses float16; CPU uses float32; explicit float32 remains available
    threshold: 0.3
  characters:
    enabled: true
    reference_images: []  # optional portraits/group images; [] keeps automatic exposure ranking
    main_group: auto  # automatic exposure ranking; legacy yellow_minions also uses automatic ranking
    device: cpu
    device_index: 0
    embedding_model: auto  # retry appearance features when human face identities fragment
    coverage_target: 0.75
    min_main_fraction: 0.85
    arcface_model: ""  # default: models/characters/arcface.onnx
    ccip_model: ""     # default: models/characters/ccip.onnx
    arcface_cosine_distance: 0.35
    ccip_cosine_distance: 0.20  # cosine; not the CCIP learned-metric threshold
    ccip_face_cosine_distance: 0.30  # automatic measured-face identity across views/costumes; co-visible actors stay separate
    body_reference_cosine_distance: 0.30  # selected whole-character crops; separate from face matching

cubase:
  project: ""
  track_name_pattern: "Sampler Track {index:02d}"
  sampler_track_count: 16
  sampler_tracks: ""  # blank keeps existing mapping; use "2-13" to skip sampler 1
  sample_rate: 48000
  channels: 2

categories:
  - A
  - E
  - O
  - U
  - LAUGH
  - HAHA
  - CRY
  - CLOSED
  - NEUTRAL
