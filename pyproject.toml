[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autoedit"
version = "0.1.0"
description = "Premiere Pro + Cubase mouth/expression matching automation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "opencv-contrib-python>=4.10",
  "mediapipe>=0.10.31,<0.11",
  "av>=16",
  "faster-whisper>=1.1.0",
  "cmudict>=1.1.1,<2",
  "soundfile>=0.13",
  "pyyaml>=6.0",
  "huggingface-hub>=0.25,<2",
  "pywinauto>=0.6.9; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
cpu = ["onnxruntime>=1.20"]
# Keep CUDA 12.4/cuDNN 9 compatible with the RTX 3050 laptop's existing driver.
gpu = [
  "ctranslate2==4.8.2",
  "onnxruntime-gpu==1.20.0",
  "nvidia-cublas-cu12==12.4.5.8",
  "nvidia-cudnn-cu12==9.1.1.17",
  "nvidia-cuda-runtime-cu12==12.4.127",
  "nvidia-cuda-nvrtc-cu12==12.4.127",
  "nvidia-cufft-cu12==11.2.1.3",
  "nvidia-nvjitlink-cu12==12.4.127",
]

[project.scripts]
autoedit = "autoedit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
