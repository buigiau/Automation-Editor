[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autoedit"
version = "0.1.0"
description = "Premiere Pro + Cubase mouth/expression matching automation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "opencv-contrib-python>=4.10",
  "mediapipe>=0.10.31,<0.11",
  "av>=16",
  "faster-whisper>=1.1.0",
  "cmudict>=1.1.1,<2",
  "soundfile>=0.13",
  "pyyaml>=6.0",
  "onnxruntime>=1.20",
  "huggingface-hub>=0.25,<2",
  "pywinauto>=0.6.9; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
autoedit = "autoedit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
